---
substitutions:
  API_KEY: "HrnLJeueTkAq4x1BBxR2ugB460w9H+Q50uNPBLgnYK0="
  OTA_PASSWORD: "ean1dkAGQi7sz9J3kGM@JG0v2Yohe930"
  PROD_MANIFEST_URL: "https://morganmlg.com/Carb-O-nated/manifest.json"
  BETA_MANIFEST_URL: "https://morganmlg.com/Carb-O-nated/manifest-beta.json"
  WEB_USERNAME: "esphome"
  WEB_PASSWORD: "esphome"
  AP_SSID: "Carb-O-nated"
  AP_PASSWORD: "esphome-fallback"
  DISPLAY_UPDATE_INTERVAL: "200"
  # Pin assignments
  PIN_I2C_SDA: GPIO21
  PIN_I2C_SCL: GPIO22
  PIN_SPI_CLK: GPIO18
  PIN_SPI_MOSI: GPIO19
  PIN_DISPLAY_BACKLIGHT: GPIO4
  PIN_BUZZER: GPIO2
  PIN_BUTTON_A: GPIO0
  PIN_BUTTON_B: GPIO35
  PIN_DISPLAY_DC: GPIO16
  PIN_DISPLAY_CS: GPIO5
  PIN_DISPLAY_RESET: GPIO23
  PIN_STATUS_LED: GPIO17

esphome:
  name: carb-o-nated
  friendly_name: "Carb-O-nated"
  comment: "ESP32 CO2 Sensor and Display"
  name_add_mac_suffix: true
  project:
    name: "DoYouHost.Carb-O-nated"
    version: "dev"
  includes:
    - co2_levels.h
    - translations.h
    - display_helpers.h
  on_boot:
    priority: 300
    then:
      - script.execute: startup_buzzer

esp32:
  board: esp32dev
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_SPIRAM_SUPPORT: n

dashboard_import:
  package_import_url: github://DoYouHost/Carb-O-nated/esp32-carb-o-nated.yml@main
  import_full_config: false

packages:
  DoYouHost/ESPHomeTemplates:
    url: https://github.com/DoYouHost/ESPHomeTemplates
    files: 
      - basic.yaml
      - debug.yaml
      - updateBetaProdStaging.yaml
      - wifiInfo.yaml
    ref: main
    refresh: 0d

wifi:
  reboot_timeout: 15min
  enable_btm: true
  enable_rrm: true
  post_connect_roaming: true
  ap: 
    ssid: "${AP_SSID}"
    password: "${AP_PASSWORD}"
  on_connect:
    - lambda: |-
        id(improv_component).stop();

time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      - then:
          - logger.log: "Time synchronized, checking for firmware updates"
          - component.update: update_http_request
    on_time:
      - seconds: 0
        minutes: 0
        hours: 22
        then:
          - component.update: update_http_request

captive_portal:

improv_serial:

esp32_improv:
  id: improv_component
  authorizer: none

api:
  reboot_timeout: 15min
  encryption:
    key: "${API_KEY}"

  actions:
    - action: set_ambient_pressure
      variables:
        pressure_mbar: int
      then:
        - script.execute:
            id: buzzer_beep_short
        - lambda: "id(co2_sensor)->set_ambient_pressure_compensation(pressure_mbar);"

http_request:
  id: http_request_component
  follow_redirects: true
  verify_ssl: true

ota:
  - platform: esphome
    password: "${OTA_PASSWORD}"

  - platform: http_request
    id: !extend ota_http_request
    on_begin:
      - then:
        - logger.log:
            format: "Starting HTTP Request OTA Update"
            level: INFO
        - component.suspend: main_display
        - component.suspend: co2_sensor

    on_error:
      - then:
        - logger.log:
            format: "HTTP Request OTA Update Failed"
            level: ERROR
        - component.resume: main_display
        - component.resume: co2_sensor

update:
  - platform: http_request
    id: !extend update_http_request
    update_interval: never

globals:
  - id: temperature_offset
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: humidity_offset
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: init_done
    type: bool
    restore_value: false
    initial_value: 'false'

i2c:
  sda: ${PIN_I2C_SDA}
  scl: ${PIN_I2C_SCL}
  scan: false
  frequency: 400kHz

spi:
  clk_pin: ${PIN_SPI_CLK}
  mosi_pin: ${PIN_SPI_MOSI}

output:
  - platform: ledc
    pin: ${PIN_DISPLAY_BACKLIGHT}
    id: output_display_backlight

  - platform: gpio
    pin: ${PIN_BUZZER}
    id: output_buzzer

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: output_display_backlight
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: gpio
    id: button_a
    name: "Button A"
    pin:
      number: ${PIN_BUTTON_A}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - then:
          - script.execute: buzzer_beep_short
          - light.toggle: display_backlight

  - platform: gpio
    id: button_b
    name: "Button B"
    pin:
      number: ${PIN_BUTTON_B}
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - then:
          - script.execute: buzzer_beep_short
          - if:
              condition:
                lambda: "return id(init_done);"
              then:
                - display.page.show_next: main_display
                - component.update: main_display

sensor:
  - platform: scd4x
    address: 0x62
    id: co2_sensor
    update_interval: 5s
    automatic_self_calibration: true
    # temperature_offset: 0
    measurement_mode: periodic
    co2:
      name: "CO2 Concentration"
      id: scd4x_co2
      unit_of_measurement: "ppm"
      filters:
        - skip_initial: 12
        - exponential_moving_average:
            alpha: 0.3
            send_every: 6
      on_value:
        then:
          - lambda: |-
              if (!id(init_done) && !isnan(x) && x > 0.0f) {
                id(init_done) = true;
                id(main_display).show_page(id(main_page));
                id(main_display).update();
              }
    temperature:
      id: scd4x_temperature
      internal: true
      unit_of_measurement: "°C"
      filters:
        - skip_initial: 12
        - exponential_moving_average:
            alpha: 0.3
            send_every: 6
    humidity:
      id: scd4x_humidity
      internal: true
      unit_of_measurement: "%"
      filters:
        - skip_initial: 12
        - exponential_moving_average:
            alpha: 0.3
            send_every: 6

  - platform: copy
    source_id: scd4x_temperature
    id: scd4x_temperature_copy
    name: "SCD4x Temperature"
    filters:
      - lambda: |-
          return x + id(temperature_offset);

  - platform: copy
    source_id: scd4x_humidity
    id: scd4x_humidity_copy
    name: "SCD4x Humidity"
    filters:
      - lambda: |-
          return x + id(humidity_offset);

text_sensor:
  - platform: template
    name: "CO2 Air Quality Level"
    id: co2_level_text
    icon: "mdi:air-filter"
    update_interval: 60s
    lambda: |-
      float co2 = id(scd4x_co2).state;
      CO2Level level = get_co2_level(co2);
      return {get_co2_level_text(level.type)};

select:
  - platform: template
    name: "Dashboard Language"
    id: dashboard_language
    icon: "mdi:translate"
    optimistic: true
    options:
      - "English"
      - "Polski"
      - "Deutsch"
      - "Français"
      - "Español"
    initial_option: "English"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            int lang_map[] = {0, 1, 2, 3, 4};
            if (x == "English") current_language = LANG_EN;
            else if (x == "Polski") current_language = LANG_PL;
            else if (x == "Deutsch") current_language = LANG_DE;
            else if (x == "Français") current_language = LANG_FR;
            else if (x == "Español") current_language = LANG_ES;

number:
  - platform: template
    name: "Temperature Offset"
    id: temperature_offset_number
    icon: "mdi:thermometer"
    unit_of_measurement: "°C"
    step: 0.1
    min_value: -10.0
    max_value: 10.0
    initial_value: 0.0
    mode: box
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(temperature_offset) = x;

  - platform: template
    name: "Humidity Offset"
    id: humidity_offset_number
    icon: "mdi:water-percent"
    unit_of_measurement: "%"
    step: 0.1
    min_value: -20.0
    max_value: 20.0
    mode: box
    initial_value: 0.0
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(humidity_offset) = x;

font:
  - file: "gfonts://Roboto@700"
    id: roboto_bold_60
    size: 60
    glyphs: "0123456789"
  - file: "gfonts://Roboto@700"
    id: roboto_bold_25
    size: 25
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°łéè"
  - file: "gfonts://Roboto@500"
    id: roboto_medium_20
    size: 20
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°₀₁₂₃₄₅₆₇₈₉"

display:
  - platform: mipi_spi
    id: main_display
    model: T-DISPLAY
    dc_pin: ${PIN_DISPLAY_DC}
    cs_pin: ${PIN_DISPLAY_CS}
    reset_pin: ${PIN_DISPLAY_RESET}
    rotation: 270°
    data_rate: 80MHz
    update_interval: ${DISPLAY_UPDATE_INTERVAL}ms
    pages:
      - id: main_page
        lambda: |-
          float co2 = id(scd4x_co2).state;

          if (isnan(co2)) {
            it.filled_rectangle(0, 0, 240, 135, Color(12, 12, 14));
            constexpr float DEG2RAD = 0.01745329f;
            float base_deg = millis() * 0.025f;  // ~14.4s per full rotation (~5°/frame)
            for (int i = 0; i < 8; i++) {
              float rad = (base_deg + i * 45.0f) * DEG2RAD;
              int x = 120 + (int)(25.0f * cosf(rad));
              int y = 67 + (int)(25.0f * sinf(rad));
              it.filled_circle(x, y, 4, Color(100 + i*20, 100 + i*20, 255));
            }
            it.print(120, 100, id(roboto_medium_20), Color(180, 180, 255), TextAlign::TOP_CENTER, get_initializing());
            return;
          }

          CO2Level level = get_co2_level_cached(co2);
          Color sc = level.color;
          const char* status_text = get_co2_level_text(level.type);
          static uint8_t frame = 0;

          // === BACKGROUND ===
          it.filled_rectangle(0, 0, 240, 135, Color(12, 12, 14));

          // === TOP STATUS TEXT ===
          it.print(120, 3, id(roboto_bold_25), sc, TextAlign::TOP_CENTER, status_text);

          // === MAIN CO2 VALUE ===
          int depth = frame % 2;
          it.printf(120 - depth, 22, id(roboto_bold_60), sc,
            TextAlign::TOP_CENTER, "%.0f", co2);

          // === SEGMENTED BAR ===
          draw_co2_bar(it, co2, sc, Color(40, 40, 45));


          // === BOTTOM INFO BAR (y: 114-132, safe zone) ===
          // Native particles — symmetric clusters aligned with "ppm CO2" baseline
          Color particle_color(140, 140, 210);
          constexpr int p_size = 4;
          constexpr int p_baseline = 128;  // matches text baseline (top 112 + ~16 for roboto 20)
          for (int i = 0; i < 4; i++) {
            int phase = (frame + i * 2) % 8;
            int bob = (phase < 4) ? phase - 2 : 5 - phase;  // triangle wave: -2..1
            int py = p_baseline - p_size + bob;
            it.filled_rectangle(46 + i * 8, py, p_size, p_size, particle_color);
            it.filled_rectangle(190 - i * 8, py, p_size, p_size, particle_color);
          }

          it.print(120, 112, id(roboto_medium_20), Color(160, 160, 180),
            TextAlign::TOP_CENTER, get_unit());

          // === CORNER BRACKETS (static, clean) ===
          int corner_len = 8;
          int corner_w = 1;
          // Top-left
          it.filled_rectangle(2, 2, corner_len, corner_w, sc);
          it.filled_rectangle(2, 2, corner_w, corner_len, sc);
          // Top-right
          it.filled_rectangle(240 - corner_len - 2, 2, corner_len, corner_w, sc);
          it.filled_rectangle(237, 2, corner_w, corner_len, sc);
          // Bottom-left
          it.filled_rectangle(2, 132, corner_len, corner_w, sc);
          it.filled_rectangle(2, 124, corner_w, corner_len, sc);
          // Bottom-right
          it.filled_rectangle(240 - corner_len - 2, 132, corner_len, corner_w, sc);
          it.filled_rectangle(237, 124, corner_w, corner_len, sc);

          frame++;
          if(frame >= 8) frame = 0;

      - id: info_page
        lambda: |-
          float co2 = id(scd4x_co2).state;
          float temp = id(scd4x_temperature_copy).state;
          float hum = id(scd4x_humidity_copy).state;
          static uint16_t frame2 = 0;
          constexpr uint16_t wave_period = 40;  // 40 * 200ms = 8s full wave

          // === BACKGROUND (neutral, per design) ===
          it.filled_rectangle(0, 0, 240, 135, Color(12, 12, 14));

          // === ACCENT COLORS ===
          CO2Level level = get_co2_level_cached(co2);
          Color co2_color = level.color;
          Color temp_color(255, 140, 60);     // warm amber
          Color hum_color(80, 190, 255);      // cool cyan
          Color label_color(150, 150, 170);
          Color divider_color(40, 40, 50);

          // Three equal rows spanning the full 135px height.
          constexpr int row_h = 45;
          constexpr int row1_y = 0;
          constexpr int row2_y = 45;
          constexpr int row3_y = 90;

          // === LEFT ACCENT STRIP (slow wave top→bottom) ===
          // Each row's width is a triangle wave of (frame2 - phase_offset),
          // so the bulge travels downward through the three strips.
          auto strip_w_for = [](uint16_t f, uint16_t phase) -> int {
            uint16_t t = (f + wave_period - phase) % wave_period;
            // triangle: 0..half..0, scaled to 0..12 (amplitude)
            uint16_t half = wave_period / 2;
            int tri = (t < half) ? (int)t : (int)(wave_period - t);
            return 3 + (tri * 12) / (int)half;  // 3..15
          };
          constexpr uint16_t phase_row1 = 0;
          constexpr uint16_t phase_row2 = wave_period / 3;       // ~2.67s behind row1
          constexpr uint16_t phase_row3 = (wave_period * 2) / 3; // ~5.33s behind row1
          it.filled_rectangle(0, row1_y, strip_w_for(frame2, phase_row1), row_h, co2_color);
          it.filled_rectangle(0, row2_y, strip_w_for(frame2, phase_row2), row_h, temp_color);
          it.filled_rectangle(0, row3_y, strip_w_for(frame2, phase_row3), row_h, hum_color);

          // === ROW DIVIDERS ===
          it.filled_rectangle(20, row2_y - 1, 214, 1, divider_color);
          it.filled_rectangle(20, row3_y - 1, 214, 1, divider_color);

          // Layout per row: [LABEL]  ...........  [VALUE] [UNIT]
          // Value and unit share a baseline — no vertical stacking.
          constexpr int unit_x = 232;   // right edge of unit
          constexpr int value_x = 188;  // right edge of value (leaves ~44px for unit)
          constexpr int label_dy = 13;  // label top offset within row (for 20px font, centered in 45px)
          constexpr int value_dy = 10;  // value top offset within row (for 25px font, centered in 45px)
          constexpr int unit_dy = 16;   // unit top offset within row (for 20px font, baseline-aligned to value)

          // === ROW 1: CO2 ===
          it.print(24, row1_y + label_dy, id(roboto_medium_20), label_color,
            TextAlign::TOP_LEFT, get_label_co2());
          if (isnan(co2)) {
            it.print(unit_x, row1_y + value_dy, id(roboto_bold_25), label_color,
              TextAlign::TOP_RIGHT, "--");
          } else {
            it.printf(value_x, row1_y + value_dy, id(roboto_bold_25), co2_color,
              TextAlign::TOP_RIGHT, "%.0f", co2);
            it.print(unit_x, row1_y + unit_dy, id(roboto_medium_20), label_color,
              TextAlign::TOP_RIGHT, "ppm");
          }

          // === ROW 2: Temperature ===
          it.print(24, row2_y + label_dy, id(roboto_medium_20), label_color,
            TextAlign::TOP_LEFT, get_label_temperature());
          if (isnan(temp)) {
            it.print(unit_x, row2_y + value_dy, id(roboto_bold_25), label_color,
              TextAlign::TOP_RIGHT, "--");
          } else {
            it.printf(value_x, row2_y + value_dy, id(roboto_bold_25), temp_color,
              TextAlign::TOP_RIGHT, "%.1f", temp);
            it.print(unit_x, row2_y + unit_dy, id(roboto_medium_20), label_color,
              TextAlign::TOP_RIGHT, "°C");
          }

          // === ROW 3: Humidity ===
          it.print(24, row3_y + label_dy, id(roboto_medium_20), label_color,
            TextAlign::TOP_LEFT, get_label_humidity());
          if (isnan(hum)) {
            it.print(unit_x, row3_y + value_dy, id(roboto_bold_25), label_color,
              TextAlign::TOP_RIGHT, "--");
          } else {
            it.printf(value_x, row3_y + value_dy, id(roboto_bold_25), hum_color,
              TextAlign::TOP_RIGHT, "%.1f", hum);
            it.print(unit_x, row3_y + unit_dy, id(roboto_medium_20), label_color,
              TextAlign::TOP_RIGHT, "%");
          }

          frame2++;
          if (frame2 >= wave_period) frame2 = 0;

button:
  - platform: template
    name: "Next Page"
    id: next_page_button
    icon: "mdi:page-next-outline"
    on_press:
      - then:
          - script.execute: buzzer_beep_short
          - if:
              condition:
                lambda: "return id(init_done);"
              then:
                - display.page.show_next: main_display
                - component.update: main_display

  - platform: shutdown
    name: "Shutdown"
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Safe Mode"
  - platform: factory_reset
    name: "Factory Reset"
  - platform: template
    name: "SCD4x Factory Reset"
    entity_category: config
    icon: "mdi:restart-alert"
    on_press:
      - then:
          - logger.log: "Performing SCD4x Factory Reset"
          - scd4x.factory_reset: co2_sensor

status_led:
  pin:
    number: ${PIN_STATUS_LED}
    inverted: false

script:
  - id: startup_buzzer
    then:
      - output.turn_on: output_buzzer
      - delay: 100ms
      - output.turn_off: output_buzzer
      - delay: 200ms
      - output.turn_on: output_buzzer
      - delay: 100ms
      - output.turn_off: output_buzzer
  
  - id: buzzer_beep_short
    then:
      - if:
          condition:
            switch.is_on: switch_buzzer_confirmation
          then:
            - output.turn_on: output_buzzer
            - delay: 50ms
            - output.turn_off: output_buzzer

switch:
  - platform: template
    id: switch_buzzer_confirmation
    name: "Buzzer Confirmation"
    icon: "mdi:bullhorn"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: switch_buzzer
    name: "Buzzer"
    icon: "mdi:volume-high"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - output.turn_on: output_buzzer
    turn_off_action:
      - output.turn_off: output_buzzer
