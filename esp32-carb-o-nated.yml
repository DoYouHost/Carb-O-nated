---
# Board: https://www.espboards.dev/esp32/lilygo-ttgo-t-display-1-14/
substitutions:
  API_KEY: "HrnLJeueTkAq4x1BBxR2ugB460w9H+Q50uNPBLgnYK0="
  OTA_PASSWORD: "ean1dkAGQi7sz9J3kGM@JG0v2Yohe930"
  PROD_MANIFEST_URL: "https://morganmlg.com/Carb-O-nated/manifest.json"
  BETA_MANIFEST_URL: "https://morganmlg.com/Carb-O-nated/manifest-beta.json"
  WEB_USERNAME: "esphome"
  WEB_PASSWORD: "esphome"
  AP_SSID: "Carb-O-nated"
  AP_PASSWORD: "esphome-fallback"
  DISPLAY_UPDATE_INTERVAL: "1000"
  # Pin assignments
  PIN_I2C_SDA: GPIO21
  PIN_I2C_SCL: GPIO22
  PIN_SPI_CLK: GPIO18
  PIN_SPI_MOSI: GPIO19
  PIN_DISPLAY_BACKLIGHT: GPIO4
  PIN_BUZZER: GPIO2
  PIN_BUTTON_A: GPIO0
  PIN_BUTTON_B: GPIO35
  PIN_DISPLAY_DC: GPIO16
  PIN_DISPLAY_CS: GPIO5
  PIN_DISPLAY_RESET: GPIO23
  PIN_STATUS_LED: GPIO17
  # WS2812B LED strip
  WS2812B_PIN: GPIO26
  WS2812B_COUNT: "3"
  # MQ-7 CO sensor
  MQ7_HEATER_PIN: GPIO25
  MQ7_ANALOG_PIN: GPIO36
  MQ7_LOW_SIDE_RESISTOR: "1000"
  MQ7_HIGH_SIDE_RESISTOR: "470"

esphome:
  name: carb-o-nated
  friendly_name: "Carb-O-nated"
  comment: "ESP32 CO2 Sensor and Display"
  name_add_mac_suffix: true
  project:
    name: "DoYouHost.Carb-O-nated"
    version: "dev"
  includes:
    - air_quality_levels.h
    - translations.h
    - display_helpers.h
  on_boot:
    priority: 300
    then:
      - script.execute: startup_buzzer
      - component.update: main_display

esp32:
  board: esp32dev
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_SPIRAM_SUPPORT: n

dashboard_import:
  package_import_url: github://DoYouHost/Carb-O-nated/esp32-carb-o-nated.yml@main
  import_full_config: false

packages:
  DoYouHost/ESPHomeTemplates:
    url: https://github.com/DoYouHost/ESPHomeTemplates
    files: 
      - basic.yaml
      - debug.yaml
      - updateBetaProdStaging.yaml
      - wifiInfo.yaml
    ref: main
    refresh: 0d

wifi:
  reboot_timeout: 15min
  enable_btm: true
  enable_rrm: true
  post_connect_roaming: true
  ap: 
    ssid: "${AP_SSID}"
    password: "${AP_PASSWORD}"
  on_connect:
    - lambda: |-
        id(improv_component).stop();

time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      - then:
          - logger.log: "Time synchronized, checking for firmware updates"
          - component.update: update_http_request
    on_time:
      - seconds: 0
        minutes: 0
        hours: 22
        then:
          - component.update: update_http_request

captive_portal:

improv_serial:

esp32_improv:
  id: improv_component
  authorizer: none

api:
  reboot_timeout: 15min
  encryption:
    key: "${API_KEY}"

  actions:
    - action: set_ambient_pressure
      variables:
        pressure_mbar: int
      then:
        - script.execute:
            id: buzzer_beep_short
        - lambda: "id(co2_sensor)->set_ambient_pressure_compensation(pressure_mbar);"

http_request:
  id: http_request_component
  follow_redirects: true
  verify_ssl: true

ota:
  - platform: esphome
    password: "${OTA_PASSWORD}"

  - platform: http_request
    id: !extend ota_http_request
    on_begin:
      - then:
        - logger.log:
            format: "Starting HTTP Request OTA Update"
            level: INFO
        - component.suspend: main_display
        - component.suspend: co2_sensor

    on_error:
      - then:
        - logger.log:
            format: "HTTP Request OTA Update Failed"
            level: ERROR
        - component.resume: main_display
        - component.resume: co2_sensor

update:
  - platform: http_request
    id: !extend update_http_request
    update_interval: never

globals:
  - id: temperature_offset
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: humidity_offset
    type: float
    restore_value: true
    initial_value: '0.0'

  - id: init_done
    type: bool
    restore_value: false
    initial_value: 'false'

i2c:
  sda: ${PIN_I2C_SDA}
  scl: ${PIN_I2C_SCL}
  scan: false
  frequency: 400kHz

spi:
  clk_pin: ${PIN_SPI_CLK}
  mosi_pin: ${PIN_SPI_MOSI}

output:
  - platform: ledc
    pin: ${PIN_DISPLAY_BACKLIGHT}
    id: output_display_backlight

  - platform: gpio
    pin: ${PIN_BUZZER}
    id: output_buzzer

  - platform: gpio
    pin: ${MQ7_HEATER_PIN}
    id: mq7_heater_pin

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: output_display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - component.update: main_display

  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: "${WS2812B_PIN}"
    num_leds: "${WS2812B_COUNT}"
    chipset: WS2812
    id: led_strip
    internal: true
    max_refresh_rate: 16ms
    effects:
      - addressable_lambda:
          name: "Wave"
          update_interval: 16ms
          lambda: |-
            float t = fmodf(millis() / 1000.0f, 628.318f);
            float max_b = id(led_strip_max_brightness).state / 100.0f;
            CO2LevelType worst = worst_aq_level(
              get_co2_level_cached(id(scd4x_co2).state).type,
              get_co_level_cached(id(mq7_co).state).type
            );
            Color aq = get_level_color(worst);
            for (int i = 0; i < it.size(); i++) {
              float b = (sinf(t * 2.0f + i * 2.094395f) * 0.35f + 0.65f) * max_b;
              it[i] = Color(
                (uint8_t)(aq.r * b),
                (uint8_t)(aq.g * b),
                (uint8_t)(aq.b * b)
              );
            }

binary_sensor:
  - platform: template
    name: "MQ7 Heater"
    icon: mdi:fire
    entity_category: diagnostic
    lambda: return id(mq7_heater).state;

  - platform: gpio
    id: button_a
    name: "Button A"
    pin:
      number: ${PIN_BUTTON_A}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - then:
          - script.execute: buzzer_beep_short
          - light.toggle: display_backlight

  - platform: gpio
    id: button_b
    name: "Button B"
    pin:
      number: ${PIN_BUTTON_B}
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - then:
          - script.execute: buzzer_beep_short
          - if:
              condition:
                lambda: "return id(init_done);"
              then:
                - display.page.show_next: main_display
                - component.update: main_display

sensor:
  - platform: scd4x
    address: 0x62
    id: co2_sensor
    update_interval: 5s
    automatic_self_calibration: true
    # temperature_offset: 0
    measurement_mode: periodic
    co2:
      name: "CO2 Concentration"
      id: scd4x_co2
      unit_of_measurement: "ppm"
      filters:
        - skip_initial: 12
        - exponential_moving_average:
            alpha: 0.3
            send_every: 6
      on_value:
        then:
          - lambda: |-
              if (!id(init_done) && !isnan(x) && x > 0.0f) {
                id(init_done) = true;
                id(main_display).show_page(id(main_page));
              }
          - component.update: main_display
    temperature:
      id: scd4x_temperature
      internal: true
      unit_of_measurement: "°C"
      filters:
        - skip_initial: 12
        - exponential_moving_average:
            alpha: 0.3
            send_every: 6
    humidity:
      id: scd4x_humidity
      internal: true
      unit_of_measurement: "%"
      filters:
        - skip_initial: 12
        - exponential_moving_average:
            alpha: 0.3
            send_every: 6

  - platform: copy
    source_id: scd4x_temperature
    id: scd4x_temperature_copy
    name: "SCD4x Temperature"
    filters:
      - lambda: |-
          return x + id(temperature_offset);

  - platform: copy
    source_id: scd4x_humidity
    id: scd4x_humidity_copy
    name: "SCD4x Humidity"
    filters:
      - lambda: |-
          return x + id(humidity_offset);

  - platform: adc
    id: mq7_raw
    name: "MQ7 Voltage"
    entity_category: diagnostic
    disabled_by_default: true
    pin: ${MQ7_ANALOG_PIN}
    attenuation: auto
    update_interval: never
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  - platform: resistance
    id: mq7_resistance
    name: "MQ7 Resistance"
    icon: mdi:omega
    entity_category: diagnostic
    disabled_by_default: true
    sensor: mq7_raw
    configuration: UPSTREAM
    resistor: ${MQ7_LOW_SIDE_RESISTOR}
    reference_voltage: 5.0V
    filters:
      - lambda: return (x - ${MQ7_HIGH_SIDE_RESISTOR});
    on_value:
      then:
        - component.update: mq7_compensated_resistance

  - platform: template
    id: mq7_compensated_resistance
    name: "MQ7 Compensated Resistance"
    icon: mdi:omega
    entity_category: diagnostic
    unit_of_measurement: Ω
    lambda: |-
      return (id(mq7_resistance).state / ( -0.01223333 * id(scd4x_temperature).state -0.00609615 * id(scd4x_humidity).state + 1.70860897));
    update_interval: never
    on_value:
      then:
        - component.update: mq7_ratio

  - platform: template
    id: mq7_ratio
    name: "MQ7 Ratio"
    icon: mdi:percent
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "%"
    lambda: |-
      return 100.0 * (id(mq7_compensated_resistance).state / id(mq7_clean_air_compensated_resistance).state);
    update_interval: never
    on_value:
      then:
        - component.update: mq7_co

  - platform: template
    id: mq7_co
    name: "CO Concentration"
    unit_of_measurement: "ppm"
    device_class: carbon_monoxide
    lambda: |-
      float ratio = id(mq7_ratio).state;
      if (isnan(ratio) || ratio <= 0.0f) return NAN;
      auto ratio_ln = log(ratio / 100.0);
      float result = exp(-0.685204 - 2.67936 * ratio_ln - 0.488075 * ratio_ln * ratio_ln - 0.07818 * ratio_ln * ratio_ln * ratio_ln);
      if (isnan(result) || result < 0.0f) return NAN;
      return result;
    update_interval: never
    on_value:
      - component.update: main_display

text_sensor:
  - platform: template
    name: "CO2 Air Quality Level"
    id: co2_level_text
    icon: "mdi:molecule-co2"
    update_interval: 60s
    lambda: |-
      CO2Level level = get_co2_level_cached(id(scd4x_co2).state);
      return {get_co2_level_text_en(level.type)};

  - platform: template
    name: "CO Air Quality Level"
    id: co_level_text
    icon: "mdi:molecule-co"
    update_interval: 60s
    lambda: |-
      CO2Level level = get_co_level_cached(id(mq7_co).state);
      return {get_co2_level_text_en(level.type)};

  - platform: template
    name: "Air Quality Level"
    id: air_quality_level_text
    icon: "mdi:air-filter"
    update_interval: 60s
    lambda: |-
      CO2LevelType worst = worst_aq_level(
        get_co2_level_cached(id(scd4x_co2).state).type,
        get_co_level_cached(id(mq7_co).state).type
      );
      return {get_co2_level_text_en(worst)};

select:
  - platform: template
    name: "Dashboard Language"
    id: dashboard_language
    icon: "mdi:translate"
    optimistic: true
    options:
      - "English"
      - "Polski"
      - "Deutsch"
      - "Français"
      - "Español"
    initial_option: "English"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            int lang_map[] = {0, 1, 2, 3, 4};
            if (x == "English") current_language = LANG_EN;
            else if (x == "Polski") current_language = LANG_PL;
            else if (x == "Deutsch") current_language = LANG_DE;
            else if (x == "Français") current_language = LANG_FR;
            else if (x == "Español") current_language = LANG_ES;
        - component.update: main_display

number:
  - platform: template
    name: "MQ7 Clean Air Resistance"
    id: mq7_clean_air_compensated_resistance
    icon: mdi:omega
    entity_category: config
    unit_of_measurement: Ω
    min_value: 1000
    max_value: 500000
    step: 100
    initial_value: 55000
    optimistic: true
    restore_value: true

  - platform: template
    name: "Temperature Offset"
    id: temperature_offset_number
    icon: "mdi:thermometer"
    unit_of_measurement: "°C"
    step: 0.1
    min_value: -10.0
    max_value: 10.0
    initial_value: 0.0
    mode: box
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(temperature_offset) = x;

  - platform: template
    name: "LED Strip Max Brightness"
    id: led_strip_max_brightness
    icon: "mdi:brightness-percent"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Humidity Offset"
    id: humidity_offset_number
    icon: "mdi:water-percent"
    unit_of_measurement: "%"
    step: 0.1
    min_value: -20.0
    max_value: 20.0
    mode: box
    initial_value: 0.0
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(humidity_offset) = x;

font:
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icon_50
    size: 50
    glyphs:
      - "\U000F0026"  # mdi:alert

  - file: "gfonts://Roboto@700"
    id: roboto_bold_60
    size: 60
    glyphs: "0123456789"
  - file: "gfonts://Roboto@700"
    id: roboto_bold_25
    size: 25
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°łéè"
  - file: "gfonts://Roboto@500"
    id: roboto_medium_20
    size: 20
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°₀₁₂₃₄₅₆₇₈₉"

display:
  - platform: mipi_spi
    id: main_display
    model: T-DISPLAY
    dc_pin: ${PIN_DISPLAY_DC}
    cs_pin: ${PIN_DISPLAY_CS}
    reset_pin: ${PIN_DISPLAY_RESET}
    rotation: 270°
    data_rate: 80MHz
    update_interval: never
    on_page_change:
      - component.update: main_display
    pages:
      - id: main_page
        lambda: |-
          if (!id(display_backlight).current_values.is_on()) return;
          float co2 = id(scd4x_co2).state;

          if (isnan(co2)) {
            it.filled_rectangle(0, 0, 240, 135, Color(12, 12, 14));
            it.print(120, 28, id(mdi_icon_50), Color(255, 180, 0), TextAlign::TOP_CENTER, "\U000F0026");
            it.print(120, 95, id(roboto_medium_20), Color(180, 180, 255), TextAlign::TOP_CENTER, get_initializing());
            return;
          }

          CO2Level level = get_co2_level_cached(co2);
          Color sc = level.color;
          const char* status_text = get_co2_level_text(level.type);

          // === BACKGROUND ===
          it.filled_rectangle(0, 0, 240, 135, Color(12, 12, 14));

          // === TOP STATUS TEXT ===
          it.print(120, 3, id(roboto_bold_25), sc, TextAlign::TOP_CENTER, status_text);

          // === MAIN CO2 VALUE ===
          it.printf(120, 22, id(roboto_bold_60), sc, TextAlign::TOP_CENTER, "%.0f", co2);

          // === SEGMENTED BAR ===
          draw_co2_bar(it, co2, sc, Color(40, 40, 45));

          // === UNIT ===
          it.print(120, 112, id(roboto_medium_20), Color(160, 160, 180),
            TextAlign::TOP_CENTER, get_unit());

          // === CORNER BRACKETS ===
          constexpr int corner_len = 8;
          constexpr int corner_w = 1;
          it.filled_rectangle(2, 2, corner_len, corner_w, sc);
          it.filled_rectangle(2, 2, corner_w, corner_len, sc);
          it.filled_rectangle(240 - corner_len - 2, 2, corner_len, corner_w, sc);
          it.filled_rectangle(237, 2, corner_w, corner_len, sc);
          it.filled_rectangle(2, 132, corner_len, corner_w, sc);
          it.filled_rectangle(2, 124, corner_w, corner_len, sc);
          it.filled_rectangle(240 - corner_len - 2, 132, corner_len, corner_w, sc);
          it.filled_rectangle(237, 124, corner_w, corner_len, sc);

      - id: info_page
        lambda: |-
          if (!id(display_backlight).current_values.is_on()) return;
          float co2 = id(scd4x_co2).state;
          float temp = id(scd4x_temperature_copy).state;
          float hum = id(scd4x_humidity_copy).state;

          // === BACKGROUND ===
          it.filled_rectangle(0, 0, 240, 135, Color(12, 12, 14));

          // === ACCENT COLORS ===
          CO2Level level = get_co2_level_cached(co2);
          Color co2_color = level.color;
          Color temp_color(255, 140, 60);
          Color hum_color(80, 190, 255);
          Color label_color(150, 150, 170);
          Color divider_color(40, 40, 50);

          constexpr int row_h = 45;
          constexpr int row1_y = 0;
          constexpr int row2_y = 45;
          constexpr int row3_y = 90;

          // === LEFT ACCENT STRIPS (static) ===
          it.filled_rectangle(0, row1_y, 4, row_h, co2_color);
          it.filled_rectangle(0, row2_y, 4, row_h, temp_color);
          it.filled_rectangle(0, row3_y, 4, row_h, hum_color);

          // === ROW DIVIDERS ===
          it.filled_rectangle(8, row2_y - 1, 226, 1, divider_color);
          it.filled_rectangle(8, row3_y - 1, 226, 1, divider_color);

          constexpr int unit_x = 232;
          constexpr int value_x = 188;
          constexpr int label_dy = 13;
          constexpr int value_dy = 10;
          constexpr int unit_dy = 16;

          // === ROW 1: CO2 ===
          it.print(12, row1_y + label_dy, id(roboto_medium_20), label_color,
            TextAlign::TOP_LEFT, get_label_co2());
          if (isnan(co2)) {
            it.print(unit_x, row1_y + value_dy, id(roboto_bold_25), label_color,
              TextAlign::TOP_RIGHT, "--");
          } else {
            it.printf(value_x, row1_y + value_dy, id(roboto_bold_25), co2_color,
              TextAlign::TOP_RIGHT, "%.0f", co2);
            it.print(unit_x, row1_y + unit_dy, id(roboto_medium_20), label_color,
              TextAlign::TOP_RIGHT, "ppm");
          }

          // === ROW 2: Temperature ===
          it.print(12, row2_y + label_dy, id(roboto_medium_20), label_color,
            TextAlign::TOP_LEFT, get_label_temperature());
          if (isnan(temp)) {
            it.print(unit_x, row2_y + value_dy, id(roboto_bold_25), label_color,
              TextAlign::TOP_RIGHT, "--");
          } else {
            it.printf(value_x, row2_y + value_dy, id(roboto_bold_25), temp_color,
              TextAlign::TOP_RIGHT, "%.1f", temp);
            it.print(unit_x, row2_y + unit_dy, id(roboto_medium_20), label_color,
              TextAlign::TOP_RIGHT, "°C");
          }

          // === ROW 3: Humidity ===
          it.print(12, row3_y + label_dy, id(roboto_medium_20), label_color,
            TextAlign::TOP_LEFT, get_label_humidity());
          if (isnan(hum)) {
            it.print(unit_x, row3_y + value_dy, id(roboto_bold_25), label_color,
              TextAlign::TOP_RIGHT, "--");
          } else {
            it.printf(value_x, row3_y + value_dy, id(roboto_bold_25), hum_color,
              TextAlign::TOP_RIGHT, "%.1f", hum);
            it.print(unit_x, row3_y + unit_dy, id(roboto_medium_20), label_color,
              TextAlign::TOP_RIGHT, "%");
          }

button:
  - platform: template
    name: "Next Page"
    id: next_page_button
    icon: "mdi:page-next-outline"
    on_press:
      - then:
          - script.execute: buzzer_beep_short
          - if:
              condition:
                lambda: "return id(init_done);"
              then:
                - display.page.show_next: main_display
                - component.update: main_display

  - platform: shutdown
    name: "Shutdown"
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Safe Mode"
  - platform: factory_reset
    name: "Factory Reset"
  - platform: template
    name: "SCD4x Factory Reset"
    entity_category: config
    icon: "mdi:restart-alert"
    on_press:
      - then:
          - logger.log: "Performing SCD4x Factory Reset"
          - scd4x.factory_reset: co2_sensor

status_led:
  pin:
    number: ${PIN_STATUS_LED}
    inverted: false

interval:
  - interval: 150s
    then:
      - switch.turn_on: mq7_heater
      - delay: 55s
      - switch.turn_off: mq7_heater
      - delay: 90s
      - repeat:
          count: 5
          then:
            - component.update: mq7_raw
            - delay: 20ms

script:
  - id: startup_buzzer
    then:
      - output.turn_on: output_buzzer
      - delay: 100ms
      - output.turn_off: output_buzzer
      - delay: 200ms
      - output.turn_on: output_buzzer
      - delay: 100ms
      - output.turn_off: output_buzzer
  
  - id: buzzer_beep_short
    then:
      - if:
          condition:
            switch.is_on: switch_buzzer_confirmation
          then:
            - output.turn_on: output_buzzer
            - delay: 50ms
            - output.turn_off: output_buzzer

switch:
  - platform: template
    name: "LED Strip"
    id: switch_led_strip
    icon: "mdi:led-strip"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          auto call = id(led_strip).turn_on();
          call.set_effect("Wave");
          call.perform();
    turn_off_action:
      - light.turn_off: led_strip

  - platform: output
    id: mq7_heater
    internal: true
